[project]
name = "mina-assistant"
version = "0.1.0"
description = "Asistente personal local con texto, voz, memoria SQLite y proveedores LLM configurables."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
mina-assistant = "mina_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["mina_assistant*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
